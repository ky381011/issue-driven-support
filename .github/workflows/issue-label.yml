name: Issue label

on:
  issues:
    types: [opened, closed]

permissions:
  issues: write

jobs:
  init:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the action in this repository for testing
      - uses: ./
        with:
          MODE: init
          INIT_BASE_LABEL: develop
          INIT_FIELD_LABEL: Suffix

  close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          MODE: close
          CLOSE_BASE_LABEL: develop
