name: Issue label

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the action in this repository for testing
      - uses: ./
        with:
          MODE: close
          CLOSE_BASE_LABEL: develop
