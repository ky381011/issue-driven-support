name: Issue label

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the action in this repository for testing
      - uses: ./
        with:
          MODE: init
          INIT_BASE_LABEL: develop
          INIT_FIELD_LABEL: Suffix
