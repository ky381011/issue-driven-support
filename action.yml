name: issue-driven-supporter
description: Issue-driven development support actions
inputs:
  MODE:
    description: "Feature to run (init, close)"
    required: true
  GITHUB_TOKEN:
    description: Token used to call the GitHub API
    default: ${{ github.token }}

  # init: Replace base label with "<base>:<suffix>" using a value from the issue form
  INIT_BASE_LABEL:
    description: "[init] Label set by the issue template (e.g. develop)"
    default: develop
  INIT_FIELD_LABEL:
    description: '[init] Label of the issue form field that holds the suffix (the "### " heading)'
    default: Suffix
  INIT_REMOVE_BASE:
    description: '[init] Remove the base label after adding "<base>:<suffix>"'
    default: "true"

  # close: Remove "<base>:*" labels when the issue is closed
  CLOSE_BASE_LABEL:
    description: '[close] Base of the labels to remove (removes "<base>:*")'
    default: develop
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        MODE: ${{ inputs.MODE }}
        ACTION_PATH: ${{ github.action_path }}
        INIT_BASE_LABEL: ${{ inputs.INIT_BASE_LABEL }}
        INIT_FIELD_LABEL: ${{ inputs.INIT_FIELD_LABEL }}
        INIT_REMOVE_BASE: ${{ inputs.INIT_REMOVE_BASE }}
        CLOSE_BASE_LABEL: ${{ inputs.CLOSE_BASE_LABEL }}
      with:
        github-token: ${{ inputs.GITHUB_TOKEN }}
        script: |
          const modes = ['init', 'close'];
          const { MODE, ACTION_PATH } = process.env;
          if (!modes.includes(MODE)) {
            core.setFailed(`Unknown MODE "${MODE}". Available: ${modes.join(', ')}`);
            return;
          }
          const run = require(`${ACTION_PATH}/src/${MODE}.js`);
          await run({ github, context, core });
